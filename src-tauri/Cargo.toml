[package]
name = "copper-core"
version = "0.1.0"
description = "铜傀儡启动器 · 铜内核"
authors = ["copper-lamp"]
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copper_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CI/发布构建用：让 openssl 从源码静态编译，构建机无需预装 OpenSSL，
# 产物也不再依赖 libcrypto/libssl 运行库 DLL。本地开发不启用此特性，
# 仍走 OPENSSL_DIR 指向的本机 OpenSSL（见 .cargo/env-check.ps1）。
vendored-openssl = ["openssl/vendored"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
directories = "5"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
openssl = "0.10"
semver = "1"
keyring = "3"
self-replace = "1"
base64 = "0.21"
quick-xml = "0.41"
async-trait = "0.1"
md-5 = "0.10"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
copper-downloader = { path = "../copper-downloader" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Security_Authentication_Web_Core",
    "Security_Credentials",
    "UI_ApplicationSettings",
] }
