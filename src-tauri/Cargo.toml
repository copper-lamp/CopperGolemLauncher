[package]
name = "copper-core"
version = "0.1.0"
description = "铜傀儡启动器 · 铜内核"
authors = ["copper-lamp"]
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copper_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CI/发布构建用：让 openssl 从源码静态编译，构建机无需预装 OpenSSL，
# 产物也不再依赖 libcrypto/libssl 运行库 DLL。本地开发不启用此特性，
# 仍走 OPENSSL_DIR 指向的本机 OpenSSL（见 .cargo/env-check.ps1）。
vendored-openssl = ["openssl/vendored"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["signature"] }
openssl = "0.10"
semver = "1"
base64 = "0.21"
quick-xml = "0.41"
async-trait = "0.1"
md-5 = "0.10"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
copper-downloader = { path = "../copper-downloader" }

# TLS 后端按平台选择：Windows 走系统 Schannel（native-tls，无额外依赖、
# 跟随系统证书库）；Android/Linux 走 rustls（纯 Rust，交叉编译无需 OpenSSL）。
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Foundation",
    "Foundation_Collections",
    "Security_Authentication_Web_Core",
    "Security_Credentials",
    "UI_ApplicationSettings",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# 桌面平台专属依赖：
# - keyring：系统密钥环，无 Android 后端（Android 走 Keystore，见 platform/secret.rs）。
# - self-replace：更新时自替换可执行文件，移动端由应用商店分发，不适用。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "3"
self-replace = "1"
