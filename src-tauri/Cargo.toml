[package]
name = "copper-core"
version = "0.1.0"
description = "铜傀儡启动器 · 铜内核"
authors = ["copper-lamp"]
edition.workspace = true
license.workspace = true

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "copper_core_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# CI/发布构建用：让 openssl 从源码静态编译，构建机无需预装 OpenSSL，
# 产物也不再依赖 libcrypto/libssl 运行库 DLL。本地开发不启用此特性，
# 仍走 OPENSSL_DIR 指向的本机 OpenSSL（见 .cargo/env-check.ps1）。
vendored-openssl = ["openssl/vendored"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 测试目标要单独嵌入 Common Controls v6 清单：tauri-build 只给最终可执行体
# 嵌入，而依赖链里的 muda/tao 会引用 comctl32!TaskDialogIndirect。
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["signature"] }
openssl = "0.10"
semver = "1"
base64 = "0.21"
quick-xml = "0.41"
async-trait = "0.1"
md-5 = "0.10"
libloading = "0.8"
zip = { version = "2", default-features = false, features = ["deflate"] }
# 设备注册凭据随机源：参考实现用 32 字节缓冲，与 uuid 的 16 字节不通用。
getrandom = "0.2"
copper-downloader = { path = "../copper-downloader" }
# 附加模块稳定契约层（模块 id 规则 / 宿主 IPC 协议 / 插件 ABI）。
# 独立成 crate 以便 helper 进程与附加模块模板复用同一份定义，而不链接 Tauri。
copper-module-abi = { path = "../copper-module-abi" }

# TLS 后端按平台选择：Windows 走系统 Schannel（native-tls，无额外依赖、
# 跟随系统证书库）；Android/Linux 走 rustls（纯 Rust，交叉编译无需 OpenSSL）。
[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "json", "stream"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_System_SystemInformation",
    "Win32_System_WinRT",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    # SHGetKnownFolderPath / FOLDERID_Downloads：解析系统「下载」目录（platform/known_dirs.rs）
    "Win32_UI_Shell",
    "Foundation",
    "Foundation_Collections",
    "Security_Authentication_Web_Core",
    "Security_Credentials",
    "UI_ApplicationSettings",
] }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }

# 桌面平台专属依赖：
# - keyring：系统密钥环，无 Android 后端（Android 走 Keystore，见 platform/secret.rs）。
# - self-replace：更新时自替换可执行文件，移动端由应用商店分发，不适用。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "3"
self-replace = "1"

# Android 专属依赖：
# - jni：调用 Kotlin 侧 Android Keystore 桥（见 platform/keystore.rs）。
#
# 刻意不用 `ndk-context`：它在未初始化时直接 panic，而本项目的依赖链里没有任何
# 一方调用 `initialize_android_context`（tao 自持一份自己的 AndroidContext），
# 用了等于在真机上留一颗「第一次读写凭证就崩溃」的雷。
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
