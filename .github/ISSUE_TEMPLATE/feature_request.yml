name: 功能请求（Feature Request）
description: 提出新功能或改进建议
title: "[feat]: "
labels: [feature]
body:
  - type: markdown
    attributes:
      value: |
        建议先阅读 docs/ 下的架构与模块设计，确认与整体架构一致。
  - type: textarea
    id: motivation
    attributes:
      label: 动机 / 解决的问题
      description: 为什么需要该功能，解决了什么问题或痛点。
      placeholder: 例如：下载内容后缺少自动解压…
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 功能描述
      description: 你期望的行为与交互。
      placeholder: 在内容下载模块中，…
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其它实现方式。
  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 如何判断功能是否完成（可选）。
      placeholder: |
        - [ ] …