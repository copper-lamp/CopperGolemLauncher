name: build

# 每日/提交/PR 校验：前端编译 + Rust 编译，用于持续验证代码可构建。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 安装前端依赖
        working-directory: .
        run: npm --prefix frontend install

      - name: 构建前端
        working-directory: .
        run: npm --prefix frontend run build

      - name: 构建 Rust (release)
        working-directory: .
        run: cargo build --release --manifest-path src-tauri/Cargo.toml