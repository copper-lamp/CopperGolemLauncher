name: build

# 三平台打包：push / PR 触发，产出 Windows / Linux / Android 安装包。
#
# 触发时机按项目要求「先在 push 跑通，再迁到 tag」——当前挂在 push/PR 上，
# 待三平台都稳定后再改为 tag 触发并挂到 Release（见 docs/平台适配.md）。
#
# 打包前置：Tauri CLI 的 `beforeBuildCommand`（根 `npm run build` → 前端 build）
# 会先构建前端产物，`tauri::generate_context!` 再把它内嵌进内核。
# 因此每个平台都需装两份依赖：根（@tauri-apps/cli）与 frontend/（Vue 工具链）。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Windows x64：NSIS(.exe) + MSI。
  # 刻意不给 `name`：job id 为 `check`，其必检项名为 `build / check`，
  # 改名会让既有分支保护规则失配、静默卡住所有 PR。
  check:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-x86_64

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci

      - name: 打包 Windows 安装包
        # runner 上没有 OpenSSL，启用 vendored 特性从源码静态编译 openssl
        run: npm run tauri:build -- --features vendored-openssl --bundles nsis,msi

      - name: 检查 Windows 打包产物
        if: always()
        shell: pwsh
        run: Get-ChildItem target/release/bundle -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: target/release/bundle/
          if-no-files-found: error

  # Linux x64：deb + AppImage。
  linux:
    name: Linux 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-x86_64

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci

      - name: 打包 Linux 安装包
        # Linux 走 rustls，openssl 由 libssl-dev 提供，无需 vendored。
        run: npm run tauri:build -- --bundles deb,appimage

      - name: 检查 Linux 打包产物
        if: always()
        run: find target/release/bundle -type f -print 2>/dev/null || true

      - name: 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: target/release/bundle/
          if-no-files-found: error

  # Android arm64：APK。
  #
  # 当前用 `--debug` 出 debug 变体 APK（由 AGP 自动用 debug keystore 签名），
  # 可直接装机自测，但**不能对外分发**。换成正式签名只需两步（见 docs/平台适配.md）：
  #   1. 在 `gen/android/app/build.gradle.kts` 加 release signingConfigs；
  #   2. CI 从 Secrets 写 `gen/android/keystore.properties` 并去掉 `--debug`。
  android:
    name: Android 安装包
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Tauri v2 Android 的基线是 17；更高的 JDK 可能与 AGP 冲突。
          java-version: 17

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: 安装 Android SDK 组件与 NDK
        run: |
          # Tauri v2.11 的 Android 模板为 compileSdk/targetSdk = 36，需装对应 platform。
          # NDK 取 r27 LTS（Tauri v2 的受支持版本线）。
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          # Tauri 经 NDK_HOME 定位 NDK
          {
            echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "RANLIB_aarch64_linux_android=$ANDROID_SDK_ROOT/ndk/27.3.13750724/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ranlib"
          } >> "$GITHUB_ENV"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci

      - name: 生成 Android 工程（仓库中尚无时）
        id: android_init
        run: |
          if [ -d src-tauri/gen/android ]; then
            echo "已存在 gen/android，跳过 init"
            echo "generated=false" >> "$GITHUB_OUTPUT"
          else
            npx tauri android init
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传新生成的 Android 工程
        # 工程尚未入库时把它作为 artifact 产出，便于提交进仓库后免去每次 init。
        if: steps.android_init.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-gen-project
          path: src-tauri/gen/android

      - name: 打包 Android 安装包
        # Android 无系统 OpenSSL，openssl 需从源码交叉编译（openssl-src 支持 NDK）。
        run: npx tauri android build --apk --debug --target aarch64 --features vendored-openssl

      - name: 上传 Android 安装包
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
