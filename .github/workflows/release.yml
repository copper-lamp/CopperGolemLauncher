name: release

# 发布版本：自动触发（push tags v*）与手动触发（需填写 tag 前缀）。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '版本 tag 名称（如 v0.1.0），仅作为发布名，需先 push 对应标签'
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2

      # tauri-action 只负责调用 `npm run tauri -- build`，不会自己装依赖：
      # 少了这一步，runner 上既没有 @tauri-apps/cli，也没有 frontend 的 Vue 工具链，
      # 会直接以「'tauri' is not recognized」失败。根与 frontend 两套都要装。
      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci

      # Release 正文直接取 CHANGELOG.md 对应版本段，不再在工作流里手写一份文案。
      # 这一步同时校验 tag（去掉 v 前缀）与 src-tauri/tauri.conf.json 的版本一致；
      # 版本段缺失或版本号对不上都会在这里失败，避免产出一个「版本对不上说明」的包。
      - name: 读取 CHANGELOG 发布说明
        id: changelog
        shell: pwsh
        run: |
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $version = $tag -replace '^v', ''
          node scripts/release-notes.mjs --version $version --out release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $body = (Get-Content -LiteralPath release-notes.md -Raw -Encoding utf8).TrimEnd()
          $delimiter = "EOF_" + [guid]::NewGuid().ToString("N")
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "body<<$delimiter" >> $env:GITHUB_OUTPUT
          $body | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $delimiter | Out-File -LiteralPath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 安装前端依赖并构建发布
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 注意：tauri-action@v0 没有 `path` 输入（会被忽略并告警），
          # 工程目录用 `projectPath`，默认即仓库根，因此这里不需要填。
          # runner 上没有 OpenSSL，启用 vendored 特性从源码静态编译 openssl
          args: --features vendored-openssl
          tagName: ${{ steps.changelog.outputs.tag }}
          releaseName: '铜傀儡 ${{ steps.changelog.outputs.tag }}'
          releaseBody: ${{ steps.changelog.outputs.body }}
          releaseDraft: true
          # 内测阶段：自动发布一律标记为预发布（Pre-release）。
          # 转为正式版时改回 false，并同步调整 README / CHANGELOG.md 的状态描述。
          prerelease: true

  # Android arm64：debug APK，作为 **Release 资产** 直接给出。
  #
  # 为什么不用 upload-artifact：GitHub 的 artifact 一律被打包成 zip（这是它的固定
  # 行为），想要「下载下来就是一个 apk、不套一层 zip」只能挂成 Release 资产。
  #
  # 与桌面版共用同一个草稿 Release：两个 job 用同一个 tagName，谁先到谁建，
  # 后到的把文件追加进去；`gh release upload --clobber` 保证重跑不冲突。
  #
  # 暂时禁用（2026-11-01）：CI 的 `tauri android build` 长期在「打包 Android APK」
  # 失败（build 与 release 两个工作流都一样），根因尚未定位；Android 目前也不作为
  # 正式支持平台。为保证每次发版的结论干净（Windows 成功即成功），先把该 job 关掉。
  # 恢复方式：删掉下面的 `if: false`，并先确认本机 `build-apk.cmd` 能出包。
  android:
    name: Android APK
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 必须 >= 21：:app 与 :minecraft 都声明 VERSION_21，JDK 17 会报
          # "invalid source release: 21"。
          java-version: 21

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: 安装 Android SDK 组件与 NDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.3.13750724"
          {
            echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
            echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/27.3.13750724"
          } >> "$GITHUB_ENV"

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: 缓存 Rust 构建产物
        uses: Swatinem/rust-cache@v2
        with:
          key: android-arm64

      - name: 安装依赖
        run: |
          npm ci
          npm --prefix frontend ci

      # 与桌面 job 同一个事实源：Android 资产挂到同一个草稿 Release，
      # 若由本 job 先创建 Release，正文同样取 CHANGELOG.md。
      - name: 读取 CHANGELOG 发布说明
        id: changelog
        env:
          TAG_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -e
          VERSION="${TAG_NAME#v}"
          node scripts/release-notes.mjs --version "$VERSION" --out release-notes.md
          echo "tag=$TAG_NAME" >> "$GITHUB_OUTPUT"

      - name: 打包 Android APK
        # Android 无系统 OpenSSL，openssl 需从源码交叉编译（openssl-src 支持 NDK）。
        run: npx tauri android build --apk --debug --target aarch64 --features vendored-openssl

      - name: 收集 APK
        run: |
          set -e
          shopt -s nullglob
          files=(src-tauri/gen/android/app/build/outputs/apk/arm64/debug/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "未找到 APK，列出产物目录以便排查："
            find src-tauri/gen/android/app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p dist
          # 可读文件名，下载后一眼能看出是什么
          cp "${files[0]}" "dist/CopperGolem-${GITHUB_REF_NAME}-android-arm64-debug.apk"
          ls -l dist

      - name: 创建草稿 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.changelog.outputs.tag }}
        run: |
          set -e
          if ! gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release create "$TAG_NAME" --draft --prerelease --title "铜傀儡 $TAG_NAME" --notes-file release-notes.md
          fi
          {
            echo "## Android APK"
            echo ""
            echo "草稿 Release \`$TAG_NAME\` 的资产（发布后即为直链下载）："
            echo "\`CopperGolem-$TAG_NAME-android-arm64-debug.apk\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 把 APK 挂成 Release 资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.changelog.outputs.tag }}
        run: |
          set -e
          gh release upload "$TAG_NAME" dist/*.apk --clobber
          gh release view "$TAG_NAME" --json assets --jq '.assets[].name'

      - name: 兜底 artifact（Release 权限不可用时至少能拿到包）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-fallback
          path: dist/*.apk
          if-no-files-found: warn
